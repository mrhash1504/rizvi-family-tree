<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Rizvi family tree — a living record of the Rizvi Sadaat of Lucknow, Murshidabad and beyond. Family members can suggest corrections and fill in missing details.">
<!-- Keeps the tree out of search results. Anyone with the link can still
     open it; it just won't be found by strangers searching family names. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<title>Rizvi Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/enhancements/stats-cards.css">
<link rel="stylesheet" href="assets/enhancements/connection-lines.css">
<link rel="stylesheet" href="assets/enhancements/badges.css">
<link rel="stylesheet" href="assets/enhancements/heatmap.css">
<link rel="stylesheet" href="assets/enhancements/timeline.css">
<link rel="stylesheet" href="assets/enhancements/stats-dashboard.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d5c53'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Georgia,serif' fill='%23fff'>R</text></svg>">
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────── -->
<header class="hdr">
  <div class="hdr-bar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">R</div>
      <div class="brand-text">
        <h1 data-i18n="siteTitle">Rizvi Family Tree</h1>
        <p data-i18n="siteSubtitle">A living record — help us fill the gaps</p>
      </div>
    </div>

    <button class="icon-btn" id="themeBtn" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>

    <button class="icon-btn lang" id="langBtn" type="button" data-i18n="langToggle" data-i18n-aria="langToggleAria">اردو</button>
  </div>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-tree" aria-controls="pane-tree" aria-selected="true" data-pane="tree" data-i18n="tabTree">Family tree</button>
    <button class="tab" role="tab" id="tab-history" aria-controls="pane-history" aria-selected="false" data-pane="history" data-i18n="tabHistory">History &amp; sources</button>
    <button class="tab" role="tab" id="tab-questions" aria-controls="pane-questions" aria-selected="false" data-pane="questions" data-i18n="tabQuestions">Open questions</button>
  </nav>
</header>

<main class="wrap">
  <div class="panes split" id="panes">

    <!-- ── Tree ──────────────────────────────────────────────────── -->
    <section class="pane tree-col" id="pane-tree" role="tabpanel" aria-labelledby="tab-tree">
      <div class="notice plain" id="localBanner" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
        <span data-i18n="offlineBanner"></span>
      </div>

      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder" aria-label="Search a name">
          <button class="clear" id="searchClear" type="button" hidden aria-label="Clear search">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="btn-pair">
          <button class="icon-btn" id="expandBtn" type="button" data-i18n="expandAll">Expand all</button>
          <button class="icon-btn" id="collapseBtn" type="button" data-i18n="collapseAll">Collapse all</button>
        </div>
      </div>

      <p class="result-note" id="resultNote" hidden></p>

      <div id="treeHost" aria-live="polite">
        <p class="empty-state" data-i18n="loading">Loading the family tree…</p>
      </div>
    </section>

    <!-- ── Detail / edit panel ───────────────────────────────────── -->
    <aside class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetName" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheetName"></h2>
        <button class="icon-btn" id="sheetClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot" id="sheetFoot"></div>
    </aside>

    <!-- Desktop only: fills the detail column until someone is selected. -->
    <aside class="side-default" id="sideDefault" aria-hidden="true"></aside>
  </div>

  <!-- ── History ─────────────────────────────────────────────────── -->
  <section class="pane" id="pane-history" role="tabpanel" aria-labelledby="tab-history" hidden>
    <p class="section-intro" data-i18n="historyIntro"></p>

    <!-- Animated Statistics Cards -->
    <div id="stats-container" class="stats-cards-container"></div>

    <!-- Phase 2 Enhancements: Data Visualizations -->
    <div id="heatmap-container"></div>
    <div id="timeline-container"></div>
    <div id="dashboard-container"></div>

    <div class="cards" id="historyHost"></div>
  </section>

  <!-- ── Open questions ──────────────────────────────────────────── -->
  <section class="pane" id="pane-questions" role="tabpanel" aria-labelledby="tab-questions" hidden>
    <p class="section-intro" data-i18n="questionsIntro"></p>
    <div class="q-list" id="questionsHost"></div>
  </section>
</main>

<footer class="foot">
  <p data-i18n="footer"></p>
  <a href="admin.html">Review queue</a>
</footer>

<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<!-- Optional. Generated weekly by tools/snapshot.js; replaces the seed above
     with the family's current record so the site stays accurate offline.
     Harmless 404 until the first snapshot is committed. -->
<script src="assets/snapshot.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/roman-urdu.js"></script>
<script src="assets/store.js"></script>
<!-- Enhancement modules -->
<script src="assets/enhancements/statistics.js"></script>
<script src="assets/enhancements/stats-renderer.js"></script>
<script src="assets/enhancements/connection-lines.js"></script>
<script src="assets/enhancements/badges.js"></script>
<script src="assets/enhancements/heatmap.js"></script>
<script src="assets/enhancements/timeline.js"></script>
<script src="assets/enhancements/stats-dashboard.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
