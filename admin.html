<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<title>Review queue — Rizvi Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%239a6f28'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Georgia,serif' fill='%23fff'>R</text></svg>">
</head>
<body>

<header class="hdr">
  <div class="hdr-bar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true" style="background:linear-gradient(140deg,#9a6f28,#0d5c53)">R</div>
      <div class="brand-text">
        <h1 data-i18n="adminTitle">Review queue</h1>
        <p><a href="index.html">← Back to the family tree</a></p>
      </div>
    </div>
    <button class="icon-btn lang" id="langBtn" type="button" data-i18n="langToggle">اردو</button>
    <button class="icon-btn" id="backupBtn" type="button" hidden data-i18n="adminBackup">Download backup</button>
    <button class="icon-btn" id="signOutBtn" type="button" hidden data-i18n="adminSignOut">Sign out</button>
  </div>

  <nav class="tabs" role="tablist" id="adminTabs" hidden>
    <button class="tab" role="tab" aria-selected="true" data-pane="queue" data-i18n="adminTitle">Review queue</button>
    <button class="tab" role="tab" aria-selected="false" data-pane="locks" data-i18n="adminManageLocks">Manage locks</button>
  </nav>
</header>

<main class="wrap">
  <!-- Sign in -->
  <div class="signin" id="signin">
    <h2 data-i18n="adminSignIn">Sign in</h2>
    <div class="form-field">
      <label for="email">Email</label>
      <input type="email" id="email" data-script="en" autocomplete="username">
    </div>
    <div class="form-field">
      <label for="pass" data-i18n="adminPassword">Admin password</label>
      <input type="password" id="pass" data-script="en" autocomplete="current-password">
    </div>
    <div class="notice bad" id="signinError" hidden></div>
    <button class="btn btn-primary" id="signinBtn" type="button" style="width:100%" data-i18n="adminSignIn">Sign in</button>
  </div>

  <section class="pane" id="pane-queue" hidden>
    <div id="queueHost"></div>
  </section>

  <section class="pane" id="pane-locks" hidden>
    <p class="section-intro">Tap a field to lock or unlock it. Locked fields are greyed out for relatives and cannot be edited from the public tree.</p>
    <div id="locksHost"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/store.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
