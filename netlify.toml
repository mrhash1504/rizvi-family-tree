# Netlify configuration.
#
# There is no build step — the site is plain HTML, CSS and JavaScript, so
# Netlify simply serves the repository root. Having this file committed means
# the deploy settings are already correct when you connect the repo; there is
# nothing to fill in by hand and nothing to get wrong later.

[build]
  # Serve the repo root as-is.
  publish = "."
  # Deliberately empty: nothing to compile.
  command = ""

[[headers]]
  for = "/*"

  [headers.values]
    # Belt and braces with the noindex meta tag in index.html. This header
    # applies to every file, not just the HTML, and search engines honour it
    # even for pages they reach without parsing.
    X-Robots-Tag = "noindex, nofollow"

    # Stop the tree being embedded in a frame on someone else's site, which
    # is the usual first step of a clickjacking attempt.
    X-Frame-Options = "DENY"

    # Don't let a browser second-guess a file's declared type.
    X-Content-Type-Options = "nosniff"

    # Don't leak the full URL to third parties in the Referer header.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # This site has no need for any of these.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
